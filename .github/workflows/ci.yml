name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run test suite
        run: node test/temporal-core.test.cjs

      - name: Run inheritance suite
        run: node test/inheritance.test.cjs

      - name: Run stage0 suite
        run: node test/stage0.test.cjs